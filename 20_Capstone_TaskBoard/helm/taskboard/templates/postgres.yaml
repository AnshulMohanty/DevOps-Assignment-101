apiVersion: v1
kind: Secret
metadata: {name: {{ include "taskboard.postgres" . }}}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "taskboard.postgres" . }}}
spec:
  selector: {app: taskboard-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "taskboard.postgres" . }}}
spec:
  replicas: 1
  # Recreate: the old pod must release the ReadWriteOnce volume before the new one starts.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: taskboard-postgres}}
  template:
    metadata: {labels: {app: taskboard-postgres}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: "{{ .Values.postgres.database }}"}
        - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: {{ include "taskboard.postgres" . }}, key: username}}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: {{ include "taskboard.postgres" . }}, key: password}}}
        # A sub-directory, because a fresh cloud disk (EBS) has lost+found at its root and initdb refuses a non-empty directory.
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        readinessProbe: {exec: {command: ["sh","-c","pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 5, periodSeconds: 10}
        volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: {{ include "taskboard.postgres" . }}-data}}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: {{ include "taskboard.postgres" . }}-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.postgres.storage }}}}
