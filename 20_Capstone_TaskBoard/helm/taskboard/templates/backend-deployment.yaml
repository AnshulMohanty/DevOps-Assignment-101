apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskboard.backend" . }}
  labels: {app: taskboard-backend}
spec:
  {{- /* With the HPA on, the HPA owns the replica count - setting it here would reset it on every upgrade. */}}
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {app: taskboard-backend}
  template:
    metadata:
      labels: {app: taskboard-backend}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      initContainers:
        # The container runs "alembic upgrade head" first and exits if PostgreSQL is not accepting
        # connections yet. Waiting here avoids a CrashLoopBackOff on the first install.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h {{ include "taskboard.postgres" . }} -p 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          ports: [{containerPort: 8000, name: http}]
          env:
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: {{ include "taskboard.postgres" . }}, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "taskboard.postgres" . }}, key: password}}
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@{{ include "taskboard.postgres" . }}:5432/{{ .Values.postgres.database }}"
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
