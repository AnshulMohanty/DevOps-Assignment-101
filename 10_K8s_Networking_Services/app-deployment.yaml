apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # write the pod's own name into the page so load balancing is visible
          command:
            - /bin/sh
            - -c
            - echo "Served by $POD_NAME" > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'
