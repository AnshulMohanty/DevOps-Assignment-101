apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # the trace_id in each JSON log line becomes a link straight to that trace in the Jaeger UI
      # (Grafana's Jaeger data source needs Jaeger's v1 query API, which Jaeger 2.21 no longer serves)
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id": "(\w+)"'
          url: 'http://localhost:16686/trace/$${__value.raw}'
          urlDisplayLabel: Open trace in Jaeger
