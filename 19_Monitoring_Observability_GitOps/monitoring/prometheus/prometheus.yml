global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: orders-api          # the application's own /metrics
    static_configs:
      - targets: ["orders-api:8000"]

  - job_name: node                # host CPU / memory / disk (here: the Docker Desktop VM)
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor            # per-container CPU / memory
    static_configs:
      - targets: ["cadvisor:8080"]
