groups:
  - name: orders-api
    rules:
      - alert: OrdersApiDown
        expr: up{job="orders-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "orders-api is not responding to scrapes"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 30 seconds."

      - alert: OrdersApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="orders-api", route="/api/orders", status=~"5.."}[1m]))
            / sum(rate(http_requests_total{job="orders-api", route="/api/orders"}[1m])) > 0.10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of /api/orders requests are failing"
          description: "Error ratio is {{ $value | humanizePercentage }}."

      - alert: OrdersApiSlowP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="orders-api", route="/api/orders"}[2m]))) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency of /api/orders is above 1s"
          description: "p95 is {{ $value | humanizeDuration }}."

  - name: host
    rules:
      - alert: HostHighCpu
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m]))) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 85% for 2 minutes"
          description: "CPU utilisation is {{ $value | printf \"%.0f\" }}%."

      - alert: HostHighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host memory above 90% for 2 minutes"
          description: "Memory utilisation is {{ $value | printf \"%.0f\" }}%."
