# Monitoring + observability stack for the orders-api demo service.
#
#   orders-api ──/metrics──> Prometheus ──> Grafana (dashboards)       metrics
#        │                       └── alerts.yml (alert rules)          alerts
#        ├──stdout JSON logs──> Alloy ──> Loki ──> Grafana             logs
#        └──OTLP spans────────> Jaeger ─────────> Jaeger UI / Grafana  traces
#   node-exporter (host CPU/memory) and cAdvisor (per-container usage) ──> Prometheus

name: observability

services:
  orders-api:
    build: ./app
    environment:
      APP_VERSION: "1.0.0"
      ERROR_RATE: "${ERROR_RATE:-0.03}"
      SLOW_RATE: "${SLOW_RATE:-0.05}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports:
      - "8000:8000"
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine "localhost" resolves to ::1 first, and the app listens on IPv4 only
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      - jaeger

  load-generator:
    image: curlimages/curl:8.6.0
    entrypoint: ["sh", "-c", "while true; do curl -s -o /dev/null http://orders-api:8000/api/orders; sleep 0.2; done"]
    depends_on:
      - orders-api

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"

  node-exporter:
    image: prom/node-exporter:v1.12.1
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys"]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command: ["--docker_only=true", "--housekeeping_interval=10s"]

  loki:
    image: grafana/loki:3.7.1
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.20.1
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["run", "/etc/alloy/config.alloy"]
    depends_on:
      - loki

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "16686:16686"   # UI

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local demo only: no login screen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger
