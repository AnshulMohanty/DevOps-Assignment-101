apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-html
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  index.html: |
    <h1>{{ .Values.message }}</h1>
    <p>release={{ .Release.Name }} revision={{ .Release.Revision }} image={{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }} replicas={{ .Values.replicaCount }}</p>
