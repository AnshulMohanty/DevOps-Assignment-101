apiVersion: v1
kind: PersistentVolume
metadata:
  name: student-pv
spec:
  storageClassName: ""            # no class - only claims that also ask for "" can bind
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/student-data
