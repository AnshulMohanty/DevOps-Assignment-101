# Two containers in one Pod sharing an emptyDir volume.
# "writer" appends a timestamp every 5s, "reader" (nginx) serves the same directory.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /cache/log.txt; sleep 5; done"]
      volumeMounts:
        - name: shared-cache
          mountPath: /cache
    - name: reader
      image: nginx:1.27
      volumeMounts:
        - name: shared-cache
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-cache
      emptyDir: {}
