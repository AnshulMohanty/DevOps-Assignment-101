# In-cluster load generator: each replica hammers the Service in a tight loop.
# Going through the Service (not a port-forward) spreads the load over every backend pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://yatri-backend-service/healthz; done"]
          resources:
            limits:
              cpu: "200m"
