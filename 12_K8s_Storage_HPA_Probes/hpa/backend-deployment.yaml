# The yatri-backend app from the Services session - the Deployment that hpa.yaml scales.
# A tiny Python HTTP server; CPU request 50m, so the 50% HPA target is 25m per pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine3.19
          command:
            - "python3"
            - "-c"
            - |
              import http.server, socketserver
              class Handler(http.server.SimpleHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(b'{"status":"healthy","service":"yatri-backend"}\n')
                  def log_message(self, *args):
                      pass
              with socketserver.TCPServer(("", 5000), Handler) as httpd:
                  httpd.serve_forever()
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "50m"        # HPA percentages are calculated against this number
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
