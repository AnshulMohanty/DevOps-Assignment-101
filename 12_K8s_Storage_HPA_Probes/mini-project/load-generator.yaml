apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: production-webapp
spec:
  replicas: 4
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://web-service; done"]
          resources:
            limits:
              cpu: "200m"
